[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wechat-mcp"
version = "0.1.0"
description = "Unified macOS WeChat MCP server, database decryptor, and history service"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "WeChat MCP Contributors" }
]
keywords = ["wechat", "mcp", "sqlcipher", "macos", "fastmcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Database",
]
dependencies = [
    "pycryptodome>=3.20.0",
    "cryptography>=41.0.0",
    "zstandard>=0.22.0",
    "mcp>=1.2.0,<2",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Popcornnnnnnnn/wechat-mcp"
Repository = "https://github.com/Popcornnnnnnnn/wechat-mcp"
Issues = "https://github.com/Popcornnnnnnnn/wechat-mcp/issues"

[project.scripts]
wechat-mcp = "wechat_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wechat_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/wechat_mcp",
    "/tests",
    "/README.md",
    "/README_CN.md",
    "/LICENSE",
    "/config.example.json",
    "/pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.DS_Store",
    "*.db*",
    "keys.json",
    "all_keys.json",
    "keys_*.json",
    "decrypted",
]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]
